name: Release plugin
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run pack
      - name: Verify release identity
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const manifest=JSON.parse(fs.readFileSync("plugin.json")); const pkg=JSON.parse(fs.readFileSync("package.json")); if(process.env.GITHUB_REF_NAME!==`v${manifest.version}` || pkg.version!==manifest.version) throw Error("Version mismatch"); if(!fs.readFileSync("RELEASE_NOTES.md","utf8").trim()) throw Error("Missing release notes")'
      - uses: actions/upload-artifact@v4
        with:
          name: recent-history-plugin
          path: dist/*
      - name: Publish immutable package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.eidos-plugin dist/*.sha256 --verify-tag --title "Recent History ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
